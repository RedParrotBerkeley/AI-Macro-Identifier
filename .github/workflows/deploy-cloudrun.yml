name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        run: echo "${{ secrets.GCP_CLOUD_RUN_KEY }}" | base64 --decode > gcloud-key.json

      - name: Login to Google Cloud
        run: |
          gcloud auth activate-service-account --key-file=gcloud-key.json
          gcloud config set project your-google-cloud-project-id
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build & Push Docker Image to Google Artifact Registry
        run: |
          docker build -t us-central1-docker.pkg.dev/your-google-cloud-project-id/macro-api:latest ./backend
          docker push us-central1-docker.pkg.dev/your-google-cloud-project-id/macro-api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy macro-api \
            --image us-central1-docker.pkg.dev/112902966057763253351/macro-api:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated
